<div class="notif-bell-wrapper">
      <!-- Bouton cloche -->
      <button class="notif-bell-btn" (click)="toggleDropdown($event)" [class.has-notif]="count > 0" aria-label="Notifications" title="Notifications">
        <i class="fas fa-bell"></i>
        @if (count > 0) {
<span class="notif-badge">{{ count > 99 ? '99+' : count }}</span>
}
      </button>

      <!-- Dropdown -->
      @if (isOpen) {
<div class="notif-dropdown glass-card" (click)="$event.stopPropagation()">
        <div class="notif-header">
          <h4>Notifications</h4>
          @if (count > 0) {
<button class="mark-all-read" (click)="markAllRead()">
            Tout marquer comme lu
          </button>
}
        </div>

        @if (notifications.length > 0) {
          <div class="notif-list">
            @for (notif of notifications; track $index) {
              <div class="notif-item" [class.unread]="!notif.lu" (click)="onNotifClick(notif)">
                <div class="notif-icon" [ngClass]="getNotifIconClass(notif.type)">
                  <i class="fas" [ngClass]="getNotifIcon(notif.type)"></i>
                </div>
                <div class="notif-content">
                  <p class="notif-message">{{ notif.message }}</p>
                  <span class="notif-time">{{ formatTime(notif.createdAt) }}</span>
                </div>
                @if (!notif.lu) {
                  <div class="notif-dot"></div>
                }
              </div>
            }
          </div>
        } @else {
          <div class="notif-empty">
            <i class="fas fa-check-circle"></i>
            <p>Aucune notification</p>
          </div>
        }
      </div>
}
    </div>
