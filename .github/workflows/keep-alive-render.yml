name: Keep Alive Render

on:
  schedule:
    # Ping toutes les 10 minutes (Render s'endort après 15 min d'inactivité)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Wake / Keep-alive Render backend
        run: |
          curl -fsS --max-time 60 --retry 2 "https://b2bmykiki.onrender.com/api/ping"
          echo ""
