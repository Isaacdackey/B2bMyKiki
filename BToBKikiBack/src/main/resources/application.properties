spring.application.name=b2b-api
spring.config.import=optional:file:.env[.properties]

# Base de donnees PostgreSQL (Neon) - via variables d'environnement (.env)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Securite JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# JPA / Hibernate + Flyway (migrations DDL pures, aucun INSERT)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Bootstrap Super Admin uniquement (aucune autre donnee au demarrage)
app.bootstrap.super-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@kikitraiteur.sn}
app.bootstrap.super-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.super-admin.nom=${APP_BOOTSTRAP_ADMIN_NAME:Direction Kiki Traiteur}

# Paiement Wave (SIMULATION en standby par defaut | LIVE en production)
app.wave.mode=${APP_WAVE_MODE:SIMULATION}
app.wave.api-key=${WAVE_API_KEY:}
app.wave.webhook-secret=${WAVE_WEBHOOK_SECRET:}

# Cloudinary (Upload signe cote serveur - via variables d'environnement .env)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:kikitraiteur}

# Taille maximale d'upload d'images
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# URL Frontend (liens d'activation et reinitialisation mot de passe)
app.frontend.url=${APP_FRONTEND_URL:https://btob-kiki.vercel.app}

# Brevo (API Transactionnelle v3 + fallback SMTP)
app.brevo.api-key=${BREVO_API_KEY:}
app.brevo.sender-email=${BREVO_SENDER_EMAIL:noreply@kikitraiteur.sn}
app.brevo.sender-name=${BREVO_SENDER_NAME:Kiki Traiteur B2B}

spring.mail.host=${SPRING_MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

